[build]
  command = "npx prisma generate && npx prisma db push && next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  DEMO_MODE = "true"
  NEXT_PUBLIC_DEMO_MODE = "true"
  NEXT_PUBLIC_APP_NAME = "EZIPAY"
  # Set in Netlify UI (do not commit secrets):
  # DATABASE_URL, SESSION_SECRET, NEXT_PUBLIC_APP_URL
  # Twilio (real SMS for login OTP + customer payment PIN):
  # TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_PHONE_NUMBER
  # DEMO_MODE mocks Stitch/Smile only — it does NOT disable Twilio.
  # Optional: STITCH_*, SMILE_*

# Next.js runtime is auto-detected by Netlify (OpenNext adapter)
